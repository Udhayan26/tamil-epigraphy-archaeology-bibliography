name: Harvest bibliography

on:
  push:
    branches: [main]
    paths:
      - "scripts/harvest.py"
      - "scripts/build.py"
      - ".github/workflows/harvest.yml"
      - "data/harvest/RUN"
  workflow_dispatch:
    inputs:
      sources:
        description: 'JSON list of sources, e.g. ["ht","ia"]. Empty = all'
        required: false
        default: ""
  schedule:
    - cron: "17 21 * * *"   # daily 02:47 IST  - quick sources + your listed sites
    - cron: "47 19 * * 5"   # Saturday 01:17 IST - full deep search (all sources)

permissions:
  contents: write

concurrency:
  group: harvest-v2
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(github.event.inputs.sources != '' && github.event.inputs.sources || (github.event.schedule == '17 21 * * *' && '["xs","ia","ol","gb","nl","oa","doab","ws","cm","wi"]' || '["xs","ia","ol","gb","loc","nl","au","oa","doab","ws","ht","cm","wi"]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harvest ${{ matrix.source }}
        continue-on-error: true
        env:
          MAX_SECONDS: "19500"
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: python scripts/harvest.py ${{ matrix.source }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harvest-${{ matrix.source }}
          path: |
            data/harvest/${{ matrix.source }}.json
            data/harvest/log_${{ matrix.source }}.txt
            data/harvest/samples/
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: harvest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: harvest-*
          path: data/harvest
          merge-multiple: true
      - name: Build merged bibliography
        run: |
          ls -la data/harvest
          python scripts/build.py | tee data/harvest/build_summary.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data BIBLIOGRAPHY.md
          git commit -m "Harvest update $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
