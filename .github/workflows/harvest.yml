name: Harvest bibliography

on:
  push:
    branches: [main]
    paths:
      - "scripts/harvest.py"
      - "scripts/build.py"
      - ".github/workflows/harvest.yml"
      - "data/harvest/RUN"
  workflow_dispatch:
    inputs:
      sources:
        description: 'JSON list of sources, e.g. ["ht","ia"]. Empty = all'
        required: false
        default: ""
  schedule:
    - cron: "17 */4 * * *"  # every 4 hours (01:47, 05:47, 09:47, 13:47, 17:47, 21:47 IST) - quick sources + your listed sites
    - cron: "47 19 * * 5"   # Saturday 01:17 IST - full deep search (all sources)

permissions:
  contents: write

concurrency:
  group: harvest-v2
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(github.event.inputs.sources != '' && github.event.inputs.sources || (github.event.schedule == '17 */4 * * *' && '["xs","ia","ol","gb","nl","oa","ws","cm","wi","td"]' || '["xs","ia","ol","gb","loc","nl","au","oa","doab","ws","ht","cm","wi","td"]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harvest ${{ matrix.source }}
        continue-on-error: true
        env:
          MAX_SECONDS: "19500"
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: python scripts/harvest.py ${{ matrix.source }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harvest-${{ matrix.source }}
          path: |
            data/harvest/${{ matrix.source }}.json
            data/harvest/log_${{ matrix.source }}.txt
            data/harvest/samples/
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: harvest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep previous harvest
        run: mkdir -p /tmp/prev && cp data/harvest/*.json /tmp/prev/ 2>/dev/null || true
      - uses: actions/download-artifact@v4
        with:
          pattern: harvest-*
          path: data/harvest
          merge-multiple: true
      - name: Build merged bibliography
        run: |
          pip install -q openpyxl
          python scripts/merge_harvest.py /tmp/prev data/harvest | tee data/harvest/merge_summary.txt
          mkdir -p /tmp/run && cp data/harvest/*.json data/harvest/*.txt /tmp/run/ 2>/dev/null || true
          cp -r data/harvest/samples /tmp/run/ 2>/dev/null || true
      - name: Rebuild on latest main and save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p /tmp/latest && rm -f /tmp/latest/*.json && cp data/harvest/*.json /tmp/latest/ 2>/dev/null || true
            cp /tmp/run/*.json data/harvest/ 2>/dev/null || true
            cp /tmp/run/*.txt data/harvest/ 2>/dev/null || true
            cp -r /tmp/run/samples data/harvest/ 2>/dev/null || true
            python scripts/merge_harvest.py /tmp/latest data/harvest > /dev/null
            python scripts/build.py | tee data/harvest/build_summary.txt
            git add -A data
            git commit -q -m "Harvest update $(date -u +%Y-%m-%d)" || { echo "nothing to commit"; exit 0; }
            if git push -q origin HEAD:main; then echo "saved"; exit 0; fi
            echo "push failed, retrying ($i)"; sleep $((i*10))
          done
          echo "::error::could not save results"; exit 1
