name: Harvest bibliography

on:
  push:
    branches: [main]
    paths:
      - "scripts/harvest.py"
      - ".github/workflows/harvest.yml"
      - "data/harvest/RUN"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to harvest (space separated: ia ol gb loc nl). Empty = all"
        required: false
        default: ""
  schedule:
    - cron: "17 21 * * 0"   # weekly, Monday 02:47 IST

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harvest sources (each in parallel, isolated)
        continue-on-error: true
        run: |
          SRC="${{ github.event.inputs.sources }}"
          [ -z "$SRC" ] && SRC="ia ol gb loc nl"
          mkdir -p data/harvest/logs
          for s in $SRC; do
            ( python scripts/harvest.py $s > data/harvest/logs/$s.log 2>&1; echo "exit $?" >> data/harvest/logs/$s.log ) &
          done
          wait
          tail -n 15 data/harvest/logs/*.log
      - name: Build merged bibliography
        if: always()
        run: python scripts/build.py | tee data/harvest/build_summary.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data BIBLIOGRAPHY.md
          git commit -m "Harvest update $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
